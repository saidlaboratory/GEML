# Goal 9 bounded symbolic-regression benchmark (issue 9-0 / #71).
#
# Production commands, run from the repository root:
#   python -m geml.data.sr.benchmark \
#     --config configs/goal9_benchmark.yaml \
#     --task-set synthetic --split-role benchmark_test \
#     --output-dir outputs/final/goal9/benchmark/synthetic
#   python -m geml.data.sr.benchmark \
#     --config configs/goal9_benchmark.yaml \
#     --task-set synthetic --split-role development \
#     --output-dir outputs/final/goal9/benchmark/synthetic_development
#   python -m geml.data.sr.benchmark \
#     --config configs/goal9_benchmark.yaml \
#     --task-set feynman_restricted --split-role benchmark_test \
#     --output-dir outputs/final/goal9/benchmark/feynman_restricted
schema_version: geml-goal9-benchmark-config-v1
output_root: outputs/final/goal9/benchmark

# Package-wide preregistered seeds. The three roles must stay distinct so that fit
# observations, out-of-sample evaluation points, and task construction never share a stream.
master_seed: 20260726
fit_seed: 20260727
evaluation_seed: 20260728

# Hard interlock for the open Goal 9 verification-scope decision. While this is false every
# generated manifest is written with status `blocked_pending_verifier_decision` and must not
# be treated as the frozen production benchmark. The coordinator flips it to true only after
# either (a) assigning an owned full-v1 equivalence verifier adapter, or (b) explicitly
# restricting the benchmark grammar to the rigorously supported fragment. Flipping it after
# seeing method results would be a post-hoc restriction and is not permitted.
allow_production_freeze: false

synthetic:
  # Frozen scale from the shared brief. Family quotas are predeclared and must sum to
  # target_count; a family that cannot be filled records a shortfall rather than being
  # regenerated until favourable tasks appear.
  target_count: 256
  family_quotas:
    - [algebraic_core, 72]
    - [powers_division_rationals, 56]
    - [exp_log, 48]
    - [trig_hyperbolic, 48]
    - [mixed_elementary, 32]

  # A disjoint development pool. Development tasks may select a configuration; they are
  # never scored and never enter a reported denominator. Structural targets are deduplicated
  # against the benchmark-test set inside each generation run.
  development_count: 32

  # Stratification axes. Every generated task is drawn from one (family, variable count,
  # depth, domain mode) cell using a seed derived from the task ordinal, so the population is
  # a pure function of master_seed.
  variable_counts: [1, 2, 3]
  depths: [2, 3, 4]
  domain_modes: [positive_real, safe_real, nonzero_real]

  # Observations are exact rational grid points; grid_denominator sets the lattice
  # resolution inside each declared interval. Fit and evaluation counts are equal so that
  # neither arm can gain resolution from the split.
  grid_denominator: 48
  fit_observation_count: 48
  evaluation_observation_count: 48
  precision_digits: 30
  max_attempts_per_point: 32
  max_generation_attempts_per_task: 64
  minimum_accepted_fit_points: 24

feynman:
  # The issue says "approximately 32". This is the predeclared frozen quota. The exact
  # accepted count and the manifest checksum are frozen once, by the coordinator, together
  # with the verification-scope decision above. The manifest always reports all three
  # denominators: inspected (100), grammar-eligible, and selected.
  selection_target: 32
  grid_denominator: 48
  fit_observation_count: 64
  evaluation_observation_count: 64
  precision_digits: 30
  max_attempts_per_point: 32
  minimum_accepted_fit_points: 32
