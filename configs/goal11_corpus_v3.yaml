  - experiment_id: production_corpus_v2
    reason: Grammar v2 is an opt-in compiler conformance extension; Goals 1-5 remain immutable.
  - experiment_id: production_corpus_v3
    reason: The resource-bounded workshop plan does not generate a new production corpus.
  - experiment_id: scaling_10x_to_100x
    reason: Ten-to-one-hundred-times corpus scaling is outside the workshop compute budget.
